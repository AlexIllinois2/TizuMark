# 推送 v* 开头的 tag 时自动构建 deb / rpm / AppImage 三种包并发布到 GitHub Release。
# 使用 tauri-apps/tauri-action 执行 tauri build，产物上传到 Release 与 Actions Artifacts。
name: CI-linux

on:
  push:
    tags: ['v*']  # 推送 v 开头的 tag 时触发（如 v1.2.0、v1.3.0-beta）

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04  # x64 runner
    permissions:
      contents: write      # 允许创建 Release / 上传产物
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Tauri v2 Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      # 前置构建 unified-bundle.js（预览渲染依赖，必须先生成）
      - name: Build renderer bundle
        run: npm run build:renderer

      # 前端聚合冒烟——验证 dist/ 可生成（build-frontend 在 CI 上不能坏）
      - name: Frontend bundle smoke
        run: npm run build-frontend

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Tauri app (Linux x64)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 自动检测 src-tauri，无需 projectPath
          tagName: ${{ github.ref_name }}
          releaseName: 'TizuMark ${{ github.ref_name }}'
          releaseBody: |
            自动构建产物，来自 tag ${{ github.ref_name }}（commit ${{ github.sha }}）。
          releaseDraft: false
          prerelease: false
          args: ''             # 默认即可，Linux x64 不需要额外 target 参数

      # 额外上传构建产物到 Actions Artifacts，方便直接下载
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-bundles-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
